<h1>Get in touch</h1>

<div class="formimg">
    <img class="imm2" src="images/contactimg.png" alt="contactImg">
    <form id="modulo" action="form.html" method="POST" name="modulo">
        <label for="fname">First name:</label><br><br>
        <input class="input" type="text" id="fname" name="fname" minlength="3" maxlength="20" placeholder="John" autofocus required><br><br>
        <label for="lname">Last name:</label><br><br>
        <input class="input" type="text" id="lname" name="lname" minlength="3" maxlength="20" placeholder="Smith" required>
        <br><br>
        <label for="email">E-mail:</label><br><br>
        <input class="input" autocomplete="email" type="email" id="email" name="email" minlength="3" placeholder="name@domain.com" required><br><br>
        <label for="message">Message:</label><br><br>
        <textarea class="input" id="message" name="message" rows="4" cols="40" placeholder="Type here your message... I would be happy to read you :)" required></textarea>
        <br><br>
        <input type="submit" value="Submit" id="send">
    </form>
</div>
